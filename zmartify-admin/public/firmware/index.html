<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Zmartify firmwarebibliotek</title>
    <style>
      :root {
        color: #17201d;
        background: #eef3f0;
        font-family: "Avenir Next", "Segoe UI", sans-serif;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        background-color: #eef3f0;
        background-image: radial-gradient(#b9c8c1 0.7px, transparent 0.7px);
        background-size: 18px 18px;
      }
      header {
        padding: 20px clamp(20px, 5vw, 64px);
        color: #fff;
        background: #163f36;
      }
      header strong { font-size: 20px; }
      main {
        width: min(960px, calc(100% - 32px));
        margin: 40px auto;
      }
      h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 44px); letter-spacing: 0; }
      .intro { max-width: 680px; color: #53635d; line-height: 1.55; }
      .controllers {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
        gap: 16px;
        margin-top: 32px;
      }
      article {
        display: flex;
        min-height: 280px;
        flex-direction: column;
        padding: 24px;
        border: 1px solid #b9c8c1;
        border-radius: 8px;
        background: #fff;
      }
      .category { margin: 0; color: #087f68; font-size: 13px; font-weight: 700; text-transform: uppercase; }
      h2 { margin: 8px 0; font-size: 24px; letter-spacing: 0; }
      .description { margin: 0; color: #53635d; line-height: 1.55; }
      .release { margin-top: auto; padding-top: 24px; }
      .version { margin: 0 0 4px; font-weight: 700; }
      .checksum { margin: 0 0 16px; color: #6b7974; font-family: "SFMono-Regular", Consolas, monospace; font-size: 12px; overflow-wrap: anywhere; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 16px;
        border: 1px solid #087f68;
        border-radius: 4px;
        color: #fff;
        background: #087f68;
        font-weight: 700;
        text-decoration: none;
      }
      .button:hover { background: #066b58; }
      .button.secondary { color: #075f51; background: #fff; }
      .button.secondary:hover { background: #edf7f3; }
      .status { padding: 18px; border-left: 4px solid #c04b32; background: #fff; }
      @media (max-width: 560px) {
        main { margin-top: 24px; }
        article { min-height: 0; padding: 18px; }
        .button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <header><strong>Zmartify Service</strong></header>
    <main>
      <h1>Firmware til controllere</h1>
      <p class="intro">Her findes den seneste frigivne firmware og installationsværktøjer til Zmartify-controllere. Vælg altid den controller, der står på enhedens mærkat.</p>
      <div id="status" class="status">Indlæser firmwareversioner...</div>
      <section id="controllers" class="controllers" aria-label="Controllere"></section>
    </main>
    <script type="module">
      const status = document.querySelector('#status');
      const container = document.querySelector('#controllers');

      function addTextElement(parent, tag, className, text) {
        const element = document.createElement(tag);
        element.className = className;
        element.textContent = text;
        parent.append(element);
        return element;
      }

      function addLink(parent, label, href, secondary = false) {
        const link = document.createElement('a');
        link.className = secondary ? 'button secondary' : 'button';
        link.href = href;
        link.textContent = label;
        parent.append(link);
      }

      try {
        const catalogResponse = await fetch('catalog.json', { cache: 'no-store' });
        if (!catalogResponse.ok) throw new Error('Kataloget kunne ikke indlæses');
        const catalog = await catalogResponse.json();

        const releases = await Promise.all(catalog.controllers.map(async (controller) => {
          try {
            const [manifestResponse, checksumResponse] = await Promise.all([
              fetch(controller.manifest, { cache: 'no-store' }),
              fetch(controller.checksum, { cache: 'no-store' }),
            ]);
            if (!manifestResponse.ok || !checksumResponse.ok) throw new Error('Firmwaredata mangler');
            return {
              controller,
              manifest: await manifestResponse.json(),
              checksum: (await checksumResponse.text()).trim().split(/\s+/)[0],
            };
          } catch {
            return { controller, error: 'Firmwareudgivelsen kan ikke indlæses.' };
          }
        }));

        for (const releaseData of releases) {
          const { controller } = releaseData;
          const card = document.createElement('article');
          addTextElement(card, 'p', 'category', controller.category);
          addTextElement(card, 'h2', '', controller.name);
          addTextElement(card, 'p', 'description', controller.description);
          const release = document.createElement('div');
          release.className = 'release';
          if ('error' in releaseData) {
            addTextElement(release, 'p', 'version', releaseData.error);
            card.append(release);
            container.append(card);
            continue;
          }
          const { manifest, checksum } = releaseData;
          const firmwarePath = manifest.builds?.[0]?.parts?.[0]?.path;
          addTextElement(release, 'p', 'version', `Seneste version: ${manifest.version || 'ukendt'}`);
          addTextElement(release, 'p', 'checksum', `SHA-256: ${checksum}`);
          const actions = document.createElement('div');
          actions.className = 'actions';
          addLink(actions, 'Åbn USB-installation', controller.installer);
          if (firmwarePath) addLink(actions, 'Download firmware', new URL(firmwarePath, new URL(controller.manifest, location.href)).href, true);
          release.append(actions);
          card.append(release);
          container.append(card);
        }
        status.remove();
      } catch (error) {
        status.textContent = error instanceof Error ? error.message : 'Firmwarebiblioteket kunne ikke indlæses.';
      }
    </script>
  </body>
</html>
